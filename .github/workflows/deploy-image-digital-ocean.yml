name: deploy-image-digital-ocean

on:
  workflow_run:
    workflows:
      - build-image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ vars.SERVER_SSH_PORT || 22 }}
          timeout: 2m
          command_timeout: ${{ vars.DEPLOY_SSH_COMMAND_TIMEOUT || '15m' }}
          script: |
            set -euo pipefail
            BACKEND_DIR='${{ vars.DEPLOY_BACKEND_DIR || '/app/habit-tracker-springboot' }}'
            if [ ! -d "$BACKEND_DIR" ]; then
              echo "ERROR: backend directory not found: $BACKEND_DIR"
              echo "Compose and .env live in the backend repo clone. Set DEPLOY_BACKEND_DIR or see habit-tracker-springboot DOCKER.md."
              exit 1
            fi
            cd "$BACKEND_DIR"
            git pull --ff-only
            deploy_frontend() {
              local compose="$1"
              $compose pull frontend
              $compose stop frontend 2>/dev/null || true
              $compose rm -f frontend 2>/dev/null || true
              $compose up -d frontend
            }
            if docker compose version >/dev/null 2>&1; then
              deploy_frontend "docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              echo "WARNING: Using legacy docker-compose v1. Install docker-compose-plugin (Compose v2) to avoid recreate bugs."
              deploy_frontend "docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' is available."
              echo "On Ubuntu/Debian: sudo apt-get install -y docker-compose-plugin"
              exit 1
            fi
